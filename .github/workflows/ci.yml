name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        shell: cmd
        run: |
          echo MSBuild path: %MSBUILD_PATH%
          msbuild WindowsFormsApp1\WindowsFormsApp1.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:WarningLevel=4 /p:GenerateManifests=false /p:SignManifests=false /m /v:minimal /flp:logfile=build.log;errorsonly
          if errorlevel 1 (
            echo Build failed. Errors:
            type build.log
            exit /b 1
          )

      - name: ClickOnce Publish (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: cmd
        run: |
          msbuild WindowsFormsApp1\WindowsFormsApp1.csproj /t:Publish /p:Configuration=Release /p:Platform=AnyCPU /p:WarningLevel=4 /p:GenerateManifests=false /p:SignManifests=false /v:minimal /flp:logfile=publish.log;errorsonly
          if errorlevel 1 (
            echo Publish failed. Errors:
            type publish.log
            exit /b 1
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BoltSpecQuery-build
          path: |
            WindowsFormsApp1/bin/Release/BoltSpecQuery.exe
            WindowsFormsApp1/bin/Release/螺栓规格查询工具.exe
            WindowsFormsApp1/bin/Release/BoltSpecQuery.exe.config
          if-no-files-found: warn

      - name: Upload ClickOnce publish (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: BoltSpecQuery-clickonce
          path: WindowsFormsApp1/publish/**/*
          if-no-files-found: warn
