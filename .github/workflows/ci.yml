name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build (Release)
        run: msbuild WindowsFormsApp1\WindowsFormsApp1.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:WarningLevel=4 /p:GenerateManifests=false /p:SignManifests=false /m /v:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BoltSpecQuery-build
          path: |
            WindowsFormsApp1/bin/Release/BoltSpecQuery.exe
            WindowsFormsApp1/bin/Release/螺栓规格查询工具.exe
            WindowsFormsApp1/bin/Release/BoltSpecQuery.exe.config
          if-no-files-found: warn
