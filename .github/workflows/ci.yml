name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build (Release)
        shell: pwsh
        run: |
          Write-Host "MSBuild path: $(where.exe msbuild 2>$null)"
          Write-Host "Building with Configuration=Release, Platform=AnyCPU"
          msbuild WindowsFormsApp1/WindowsFormsApp1.csproj `
            /p:Configuration=Release /p:Platform=AnyCPU /p:WarningLevel=4 `
            /p:GenerateManifests=false /p:SignManifests=false /m `
            /v:minimal 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed. Last 50 lines of log:"
            Get-Content build.log -Tail 50
            exit $LASTEXITCODE
          }

      - name: ClickOnce Publish (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          msbuild WindowsFormsApp1/WindowsFormsApp1.csproj `
            /t:Publish /p:Configuration=Release /p:Platform=AnyCPU /p:WarningLevel=4 `
            /p:GenerateManifests=false /p:SignManifests=false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BoltSpecQuery-build
          path: |
            WindowsFormsApp1/bin/Release/BoltSpecQuery.exe
            WindowsFormsApp1/bin/Release/螺栓规格查询工具.exe
            WindowsFormsApp1/bin/Release/BoltSpecQuery.exe.config

      - name: Upload ClickOnce publish (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: BoltSpecQuery-clickonce
          path: WindowsFormsApp1/publish/**/*
