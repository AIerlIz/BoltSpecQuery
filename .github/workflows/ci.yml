name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        shell: cmd
        run: |
          msbuild WindowsFormsApp1\WindowsFormsApp1.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:WarningLevel=4 /p:GenerateManifests=false /p:SignManifests=false /m

      - name: ClickOnce Publish
        if: startsWith(github.ref, 'refs/tags/')
        shell: cmd
        run: msbuild WindowsFormsApp1\WindowsFormsApp1.csproj /t:Publish /p:Configuration=Release /p:Platform=AnyCPU /p:WarningLevel=4 /p:GenerateManifests=false /p:SignManifests=false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BoltSpecQuery-build
          path: |
            WindowsFormsApp1/bin/Release/BoltSpecQuery.exe
            WindowsFormsApp1/bin/Release/螺栓规格查询工具.exe
            WindowsFormsApp1/bin/Release/BoltSpecQuery.exe.config
          if-no-files-found: warn

      - name: Upload ClickOnce publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: BoltSpecQuery-clickonce
          path: WindowsFormsApp1/publish/**/*
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            WindowsFormsApp1/bin/Release/BoltSpecQuery.exe
            WindowsFormsApp1/bin/Release/螺栓规格查询工具.exe
            WindowsFormsApp1/publish/setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
